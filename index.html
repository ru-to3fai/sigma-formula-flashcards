<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3f1e9">
<title>Σ公式フラッシュカード</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<style>
:root{--ink:#263b42;--muted:#66777b;--accent:#bb514c;--paper:#fffdf7;--line:#d9ddd8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f2f3ec;color:var(--ink);font-family:system-ui,"Noto Sans JP",sans-serif}
main{width:min(100%,820px);margin:auto;padding:clamp(24px,5vw,56px) 18px 60px}
.brand{display:flex;align-items:center;gap:12px;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.16em}.mark{display:grid;place-items:center;width:42px;height:42px;border:2px solid var(--accent);border-radius:12px;font-family:Georgia,serif;font-size:27px;letter-spacing:0}
h1{margin:22px 0 4px;font-size:clamp(28px,5vw,40px);line-height:1.3}.subtitle{margin:0;color:var(--muted);font-size:15px}
.status{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:38px 0 14px;font-weight:700}.status span:first-child{color:var(--accent);font-size:13px;letter-spacing:.08em}.progress{height:6px;background:#e0e4df;border-radius:20px;overflow:hidden;margin-bottom:18px}.fill{height:100%;width:0;background:var(--accent);transition:width .25s}
.card{display:block;width:100%;min-height:340px;padding:clamp(22px,5vw,40px);border:1px solid var(--line);border-radius:25px;text-align:left;color:var(--ink);background:var(--paper);background-image:linear-gradient(to bottom,transparent 31px,rgba(80,128,151,.12) 32px);background-size:100% 32px;box-shadow:0 14px 42px rgba(41,54,53,.09);cursor:pointer;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(41,54,53,.14)}.card:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.label{display:block;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.14em}.formula{display:flex;align-items:center;justify-content:center;min-height:122px;margin:22px 0 12px;font-size:clamp(31px,6vw,53px);overflow-x:auto;overflow-y:hidden}.formula .katex{font-size:1em}.answer{border-top:2px solid var(--accent);padding-top:20px;margin-top:16px}.answer .formula{min-height:80px;margin:12px 0;font-size:clamp(26px,5vw,39px)}.hint{display:block;margin-top:22px;text-align:center;color:var(--muted);font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}.actions button{border:1px solid #c9d0cc;border-radius:12px;padding:13px 22px;background:#fff;color:var(--ink);font-size:16px;font-weight:700;cursor:pointer}.actions .next{background:var(--accent);border-color:var(--accent);color:#fff;flex:1}.actions button:hover{filter:brightness(.97)}[hidden]{display:none!important}
math{font-family:serif}@media(max-width:600px){.card{min-height:300px}.actions button{padding:12px 16px}.formula{min-height:105px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body><main>
<header><div class="brand"><span class="mark" aria-hidden="true">Σ</span><span>MATH STUDY NOTES</span></div><h1>Σ公式フラッシュカード</h1><p class="subtitle">カードをめくって、和を積の形にしてみよう。</p></header>
<div class="status"><span>QUESTION</span><span id="count" aria-live="polite">1 / 12</span></div><div class="progress" role="progressbar" aria-label="進行状況" aria-valuemin="1" aria-valuemax="12" aria-valuenow="1" id="progress"><div class="fill" id="fill"></div></div>
<button class="card" id="card" type="button" aria-expanded="false" aria-controls="answer"><span class="label" id="question-label">QUESTION 01</span><span class="formula" id="question"></span><span class="answer" id="answer" hidden><span class="label">答え</span><span class="formula" id="result"></span></span><span class="hint" id="hint">タップして答えを見る ↗</span></button>
<nav class="actions" aria-label="カード操作"><button class="next" type="button" id="next">次のカード →</button><button type="button" id="reset">最初から</button><button type="button" id="reshuffle">別の12問</button></nav>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const variants=[
 {top:'n',first:'n',second:'(n+1)',third:'(2n+1)',constant:'n'},
 {top:'n-1',first:'(n-1)',second:'n',third:'(2n-1)',constant:'(n-1)'},
 {top:'n+1',first:'(n+1)',second:'(n+2)',third:'(2n+3)',constant:'(n+1)'}
];
function make(type,v,c){const sum='\\displaystyle\\sum_{k=1}^{'+v.top+'}';let question,answer;
 if(type==='linear'){question=sum+'k';answer='\\frac{1}{2}\\cdot '+v.first+'\\cdot '+v.second}
 if(type==='square'){question=sum+'k^{2}';answer='\\frac{1}{6}\\cdot '+v.first+'\\cdot '+v.second+'\\cdot '+v.third}
 if(type==='constant'){question=sum+c;answer=c+'\\cdot '+v.constant}
 return {question,answer,type,top:v.top,coefficient:c||0};
}
function numeric(m){return {top:String(m),first:String(m),second:String(m+1),third:String(2*m+1),constant:String(m)}}
function deck(){const cards=[];for(const type of ['linear','square','constant']){
 const coefficient=()=>type==='constant'?[2,3,5,7][Math.floor(Math.random()*4)]:0;
 cards.push(make(type,variants[['linear','square','constant'].indexOf(type)],coefficient()));
 for(const m of shuffle([4,5,6,7,8,9,10,11,12]).slice(0,3))cards.push(make(type,numeric(m),coefficient()));
 }return shuffle(cards)}
const M='http://www.w3.org/1998/Math/MathML';
function render(target,tex){if(window.katex){try{window.katex.render(tex,target,{throwOnError:true,output:'htmlAndMathml'});return}catch(e){console.warn(e)}}
 // MathML fallback covers the sum and product without exposing TeX source as text.
 const m=document.createElementNS(M,'math'),row=document.createElementNS(M,'mrow');m.setAttribute('display','block');
 const source=tex.replace(/\\displaystyle/g,'').replace(/\\cdot/g,'·').replace(/\\sum_\{k=1\}\^\{([^}]+)\}/g,'Σ(k=1…$1) ')
   .replace(/\\frac\{1\}\{([246])\}/g,'1/$1 ').replace(/\^\{([^}]+)\}/g,'^$1').replace(/[{}]/g,'');
 row.textContent=source;m.append(row);target.replaceChildren(m)}
let cards=[],current=0,open=false;
function show(){const item=cards[current];$('count').textContent=(current+1)+' / '+cards.length;$('question-label').textContent='QUESTION '+String(current+1).padStart(2,'0');render($('question'),item.question);render($('result'),item.answer);open=false;$('answer').hidden=true;$('card').setAttribute('aria-expanded','false');$('hint').textContent='タップして答えを見る ↗';$('progress').setAttribute('aria-valuenow',String(current+1));$('fill').style.width=((current+1)/cards.length*100)+'%'}
function restart(newDeck){if(newDeck)cards=deck();current=0;show()}
$('card').addEventListener('click',()=>{open=!open;$('answer').hidden=!open;$('card').setAttribute('aria-expanded',String(open));$('hint').textContent=open?'もう一度タップして隠す ↗':'タップして答えを見る ↗'});
$('next').addEventListener('click',()=>{current=(current+1)%cards.length;show();$('card').focus()});
$('reset').addEventListener('click',()=>restart(false));$('reshuffle').addEventListener('click',()=>restart(true));window.addEventListener('DOMContentLoaded',()=>restart(true),{once:true});
</script></body></html>
